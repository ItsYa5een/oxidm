[package]
name = "oxidl-core"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1"
percent-encoding = "2"
reqwest = { version = "0.11", features = ["stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"
url = "2"
