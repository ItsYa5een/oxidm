[package]
name = "oxidl-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = "0.9"
libadwaita = "0.7"
glib = "0.20"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
oxidl-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
